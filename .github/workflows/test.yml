name: Run tests
on:
  - push
  - pull_request

env:
  RUST_BACKTRACE: 1

jobs:
  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.78.0
          - stable
        features:
          - "--no-default-features"
          - "--features std"
          - "--features std,system"
    runs-on: windows-latest
    name: windows-msvc ${{ matrix.toolchain }} ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }}

  windows-gnu:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.78.0-gnu
          - stable-gnu
        features:
          - "--no-default-features"
          - "--features std"
    runs-on: windows-latest
    name: windows-gnu ${{ matrix.toolchain }} ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSYS2
        uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f
        with:
          release: false
          path-type: inherit
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run tests
        shell: msys2 {0}
        run: cargo test --workspace ${{ matrix.features }}

  # Reproduces edge-toolkit/core's gnullvm failure. The Rust *host* is itself x86_64-pc-windows-gnullvm
  # (so target == host), which makes not_msvc.rs skip --host. Critically the build runs under MSYS2's MSYS
  # subsystem (msystem: MSYS) -- the same as edge-toolkit's conda msys2 sh -- so libffi's config.guess reports
  # x86_64-pc-msys and enables the Linux static-trampoline path, which cannot compile with a windows-gnu clang
  # (undeclared size_t / sysconf / off_t / malloc in tramp.c). Under MINGW64/UCRT64 config.guess instead reports
  # a windows host and the build succeeds, which is why a plain MSYS2 setup hides the bug.
  windows-gnullvm:
    runs-on: windows-latest
    name: windows-gnullvm stable
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSYS2 (MSYS subsystem)
        uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f
        with:
          msystem: MSYS
          release: false
          path-type: inherit
      - name: Install llvm-mingw
        shell: bash
        run: |
          ver=20260602
          base=https://github.com/mstorsjo/llvm-mingw/releases/download
          curl -L -o "$RUNNER_TEMP/llvm-mingw.zip" "$base/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          7z x "$RUNNER_TEMP/llvm-mingw.zip" -o"$RUNNER_TEMP" > /dev/null
          echo "LLVM_MINGW_BIN=$RUNNER_TEMP/llvm-mingw-$ver-ucrt-x86_64/bin" >> "$GITHUB_ENV"
      - name: Install gnullvm host toolchain
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal
          rustup default stable-x86_64-pc-windows-gnullvm
      - name: Build libffi-sys (gnullvm host, MSYS subsystem)
        shell: msys2 {0}
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-gnullvm
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: ${{ env.LLVM_MINGW_BIN }}/clang.exe
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_RUSTFLAGS: -Cdlltool=${{ env.LLVM_MINGW_BIN }}/llvm-dlltool.exe
        run: cargo build -vv -p libffi-sys

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-26
        toolchain:
          - 1.78.0
          - stable
        features:
          - "--no-default-features"
          - "--features std"
          - "--features std,system"
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install autoconf automake libtool libffi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run tests
        run: 'cargo test --workspace ${{ matrix.features }}'

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        toolchain:
          - 1.78.0
          - stable
        features:
          - "--no-default-features"
          - "--features std"
          - "--features std,system"
    runs-on: ubuntu-latest
    name: ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run tests
        run: 'cargo test --workspace ${{ matrix.features }}'

  free-bsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y libffi curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            . "$HOME/.cargo/env"
            cargo test --workspace 

  qemu:
    runs-on: ubuntu-latest
    name: QEMU (armv7, powerpc64, powerpc64le, riscv64, s390x, sparc64)
    steps:
      - uses: actions/checkout@v6
      - name: Setup and run tests
        run: 'scripts/qemutests.sh SETUP'
